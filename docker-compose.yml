# Infraestructura local reproducible.
#
# Dos servicios sin perfil (`db`, `blob`) que se levantan con `npm run up:infra`, y el perfil
# `app` (Fase 7) con el propio scraper en roles planner/worker. Quien no tenga Docker no
# necesita nada de esto: `npm start` cae a PGlite + disco local y avisa en una línea.
#
# Todos los tags son exactos, incluido el `node` del Dockerfile. Un tag flotante significa que la
# imagen que alguien construya dentro de seis meses no es la que probó esta suite, y el primer
# síntoma de eso es un fallo que nadie puede reproducir.
#
# Variables: compose interpola `${...}` desde el entorno o desde `.env` (ver .env.example). Los
# servicios del perfil `app` traen todos sus defaults aquí, así que funcionan sin ningún archivo.

name: juris-scraper

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juris}
      POSTGRES_DB: ${POSTGRES_DB:-juris}
      # Determinismo en las comparaciones de texto y en el ordenamiento: el dataset es
      # portugués y las consultas del reporte agrupan por clase judicial.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # DECISIÓN LOCAL: el puerto publicado por defecto es 55432, no 5432. Un 5432 libre en la
      # máquina del evaluador es la excepción, no la regla (cualquier Postgres local o túnel SSH
      # lo ocupa) y el fallo de `compose up` es opaco. Dentro de la red de compose el servicio
      # sigue escuchando en 5432, así que .env.docker no cambia.
      - '${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-juris} -d ${POSTGRES_DB:-juris}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  blob:
    # RustFS: drop-in del API S3, Apache 2.0. Se eligió tras descartar MinIO (community
    # archivado) y LocalStack (exige token de cuenta). Ver docs/ADR/0002-s3-api-rustfs.md.
    image: rustfs/rustfs:1.0.0-alpha.68
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-juris}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-jurisjuris}
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - blobdata:/data
    ports:
      # DECISIÓN LOCAL: mismo criterio que en `db`. 9000 es el puerto por defecto de bastantes
      # servicios locales (el propio MinIO histórico, Portainer, php-fpm).
      - '${S3_PORT:-59000}:9000' # API S3
      - '${S3_CONSOLE_PORT:-59001}:9001' # consola web
    healthcheck:
      # La imagen es distroless y no trae curl ni wget; el propio binario responde el probe.
      test: ['CMD', '/usr/bin/rustfs', '--version']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────── perfil `app` ───────────────────────────
  #
  # `docker compose --profile app up --scale worker=3` levanta el sistema completo: el tribunal
  # falso, un planificador que construye la raíz del árbol de particiones y sale, y N workers que
  # se reparten la cola. Los tres workers comparten cola (SKIP LOCKED) y cortesía (una fila de
  # site_throttle), que es justamente lo que hay que demostrar: escalar horizontalmente no
  # multiplica la presión sobre el sitio.

  fake:
    profiles: ['app', 'demo']
    build:
      context: .
      target: demo
    environment:
      FAKE_PORT: '8080'
      FAKE_DAYS: '${FAKE_DAYS:-120}'
    ports:
      - '${FAKE_PORT:-58080}:8080'

  planner:
    profiles: ['app']
    build:
      context: .
      target: runtime
    # Sale en cuanto siembra la raíz: no es un servicio, es un paso.
    restart: 'no'
    command:
      [
        'crawl',
        '--role',
        'planner',
        '--site',
        '${SITE:-fake-pje}',
        '--pdf-budget',
        '${PDF_BUDGET:-0}',
      ]
    environment: &app_env
      DB_DRIVER: pg
      DATABASE_URL: postgres://${POSTGRES_USER:-juris}:${POSTGRES_PASSWORD:-juris}@db:5432/${POSTGRES_DB:-juris}
      DB_AUTO_MIGRATE: 'true'
      BLOB_DRIVER: s3
      S3_ENDPOINT: http://blob:9000
      S3_BUCKET: ${S3_BUCKET:-juris}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-juris}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-jurisjuris}
      S3_FORCE_PATH_STYLE: 'true'
      SITE: ${SITE:-fake-pje}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://fake:8080}
      ROOT_START: ${ROOT_START:-2024-01-01}
      ROOT_END: ${ROOT_END:-2024-02-29}
      PDF_BUDGET: ${PDF_BUDGET:-0}
      CONCURRENCY: ${CONCURRENCY:-4}
      CONCURRENCY_MAX: ${CONCURRENCY_MAX:-8}
      CONCURRENCY_MIN: ${CONCURRENCY_MIN:-1}
      RATE_PER_SEC: ${RATE_PER_SEC:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      blob:
        condition: service_healthy
      fake:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      target: runtime
    restart: 'no'
    command: ['crawl', '--role', 'worker', '--site', '${SITE:-fake-pje}']
    environment:
      <<: *app_env
      # Cada réplica se identifica sola (hostname + pid), que es lo que hace legible quién tiene
      # arrendado cada job en `juris.job.leased_by`.
      METRICS_PORT: '9464'
    depends_on:
      # El planificador siembra la raíz y termina; arrancar antes sería encontrar la cola vacía
      # y salir con éxito sin haber hecho nada.
      planner:
        condition: service_completed_successfully

volumes:
  pgdata:
  blobdata:
